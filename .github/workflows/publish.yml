name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # needed for npm provenance / trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # The package ships raw .ts source via exports: { ".": "./src/index.ts" }.
      # This is intentional: OpenCode plugins run in a Bun/TypeScript-native
      # runtime that can consume .ts directly. No build step is needed.
      - name: Set version from release tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Set up npm authentication
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
