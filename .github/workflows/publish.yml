name: Publish Package

on:
  push:
    tags:
      - 'v*'

# id-token: write enables OIDC trusted publishing — the npm CLI authenticates
# via GitHub's OIDC identity instead of a registry token secret.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # The package ships raw .ts source via exports: { ".": "./src/index.ts" }.
      # This is intentional: OpenCode plugins run in a Bun/TypeScript-native
      # runtime that can consume .ts directly. No build step is needed.
      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm v10.9+ is required for OIDC trusted publishing support.
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Set version from release tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # package.json already has publishConfig.access: "public".
      # No --provenance flag needed — OIDC trusted publishing produces
      # provenance automatically.
      - name: Publish package
        run: npm publish
